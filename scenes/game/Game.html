<section class="play-layout" aria-label="第 ${id} 关">${sceneImage('map','game-background')}<nav class="play-top-actions" aria-label="局内菜单"><button class="icon-btn" data-action="pause" aria-label="暂停" title="暂停">${wrap('<path d="M23 17h6v30h-6zm12 0h6v30h-6z" fill="currentColor"/>','icon')}</button><button class="icon-btn" data-action="exit" aria-label="退出" title="退出">${wrap('<path d="M27 14H15v36h12M32 32h20M43 22l10 10-10 10" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>','icon')}</button></nav><header class="wood-hud"><button class="hud-mascot" data-action="home" aria-label="返回花园">${catPortrait()}</button><div class="hud-goals"><h2>目标</h2><div class="goals" id="goals">${game.level.goals.map(g=>goalHTML(g)).join('')}</div></div><div class="moves" id="moves"><small>步数</small><strong>${game.moves}</strong></div><div class="harvest-meter" role="progressbar" aria-label="目标完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="score-fill"></i><span>★</span><span>★</span><span>★</span></div><span class="game-level-label">第 ${id} 关${game.level.design?' · '+safeText(game.level.design.title):''}</span></header><div class="game-center"><div class="game-panel"><div class="board-wrap">${/* VIEW:board/Board.html */}<div class="board-feedback" id="board-feedback"></div></div><div class="game-footer"><span>收获 <b id="score">0</b></span><span id="board-tip">相邻同色，两个就能消除</span></div></div></div>${boosterBar()}<p class="screen-reader" id="live" aria-live="polite"></p></section>
